name: Bug report
description: Report errors or unexpected behavior.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting issues of Yukigram!

        To make it easier for us to help you please enter detailed information below.
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: Tell us what should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Tell us what happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: >
        Your operating system name, version and desktop environment.
        **Don't use kernel version (uname), it's useless.**
    validations:
      required: true
  - type: input
    attributes:
      label: Version of Yukigram
      description: >
        Only commits tagged `yukigram-[version]` (like yukigram-6.4.1) are supported.

        Please note we don't support versions from Linux distro repositories.
        If you need support for these versions, **please contact your distro maintainer**
        or your distro bugtracker.
        **Don't use 'latest'**, please specify actual version.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - Our PostmarketOS binary cache
        - Our Nix binary cache
        - Our Flatpak repository
        - Manually-built nix package
        - Manually-built PKGBUILD
        - Manually-built flatpak
        - Source build with docker image
        - Other (please specify)
    validations:
      required: true
  - type: input
    attributes:
      label: Crash ID
      description: >
        If you're reporting a crash, please enter the crash ID from the crash reporter
        opening on the next launch after crash. **You have to enable beta versions
        installation in Settings -> Advanced for the reporter to appear.**
        You don't have to wait for a beta version to arrive.
  - type: textarea
    attributes:
      label: Logs
      description: >
        You can find log.txt using the `viewlogs`
        [cheat code](https://github.com/telegramdesktop/tdesktop/wiki/Cheat-Codes).
      placeholder: Insert log.txt here (if necessary)
      render: shell
